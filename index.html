    <script>
      (function() {
        try {
          var settable = true;
          try {
            var orig = window.fetch;
            window.fetch = orig;
          } catch (_) {
            settable = false;
          }
          if (!settable && typeof window !== 'undefined') {
            var _cur = window.fetch ? window.fetch.bind(window) : null;
            Object.defineProperty(window, 'fetch', {
              get: function() { return _cur; },
              set: function(val) { _cur = val; },
              configurable: true,
              enumerable: true
            });
          }
          window.addEventListener('error', function(e) {
            if (e && e.filename && e.filename.indexOf('chrome-extension://') !== -1) {
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
              if (e.preventDefault) e.preventDefault();
              return true;
            }
          }, true);
        } catch (_) {}
      })();
    </script>
